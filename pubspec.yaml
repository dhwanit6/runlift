name: runlift
description: "RunLift - 28 Days to 5K Training App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # CORE & UTILITY
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  vibration: ^2.0.0
  flutter_animate: ^4.5.2

  # FIREBASE
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  google_sign_in: ^6.2.1

  # FEATURES
  just_audio: ^0.9.38
  flutter_local_notifications: ^17.1.2
  fl_chart: ^0.68.0
  lottie: ^3.1.2
  share_plus: ^9.0.0
  flutter_tts: ^4.0.2
  timezone: ^0.9.3
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0

  # MAPS (OpenStreetMap - FREE)
  geolocator: ^12.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  confetti: ^0.8.0
  url_launcher: ^6.3.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/icon/
